map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# 80 端口：仅承载 ACME 校验与静态下载，其余一律跳 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name zhixin.example.com;

    client_max_body_size 64m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    # 前缀 location：覆盖 adapter-bundles/ 等热更新资源（旧配置只有两个精确匹配，导致 adapter 404）
    location /downloads/ {
        alias /opt/zhixin-ai-downloads/;
        autoindex off;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /downloads/zhixin-ai-windows.exe {
        alias /opt/zhixin-ai-downloads/zhixin-ai-windows.exe;
        default_type application/vnd.microsoft.portable-executable;
        add_header Content-Disposition 'attachment; filename="zhixin-ai-windows.exe"';
        add_header Cache-Control "public, max-age=3600";
    }

    location = /downloads/desktop-version.json {
        alias /opt/zhixin-ai-downloads/desktop-version.json;
        default_type application/json;
        charset utf-8;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        add_header Cache-Control "no-store" always;
    }

    location / {
        return 301 https://zhixin.example.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zhixin.example.com;

    ssl_certificate /etc/letsencrypt/live/zhixin.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zhixin.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 64m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "frame-ancestors 'self' tauri://localhost https://tauri.localhost" always;

    location /downloads/ {
        alias /opt/zhixin-ai-downloads/;
        autoindex off;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /downloads/zhixin-ai-windows.exe {
        alias /opt/zhixin-ai-downloads/zhixin-ai-windows.exe;
        default_type application/vnd.microsoft.portable-executable;
        add_header Content-Disposition 'attachment; filename="zhixin-ai-windows.exe"';
        add_header Cache-Control "public, max-age=3600";
    }

    location = /downloads/desktop-version.json {
        alias /opt/zhixin-ai-downloads/desktop-version.json;
        default_type application/json;
        charset utf-8;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        add_header Cache-Control "no-store" always;
    }

    # Direct backend routes preserve Bearer headers and bypass web login redirects.
    location ~ ^/mcp/?$ {
        client_max_body_size 128k;
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location = /api/mcp/video-assets/upload {
        client_max_body_size 502m;
        client_body_timeout 300s;
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location = /api/mcp/article-assets/upload {
        client_max_body_size 12m;
        client_body_timeout 120s;
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Private loopback API mapping in docker-compose.prod.yml; never public.
    location ^~ /api/video-assets/ {
        client_max_body_size 502m;
        client_body_timeout 300s;
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
