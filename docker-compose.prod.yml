name: zhixin-ai-production

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-security: &default-security
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  logging: *default-logging

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  UPLOAD_DIR: /app/uploads
  ZX_PRIVATE_VIDEO_DIR: /app/private-video-assets
  PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
  AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:-https://zhixin.example.com}
  AUTH_TRUSTED_HOSTS: ${AUTH_TRUSTED_HOSTS:-zhixin.example.com,localhost,127.0.0.1,api}
  MEDIA_PUBLISH_FALLBACK_MOCK: "false"

x-backend-service: &backend-service
  <<: *default-security
  image: zhixin-ai-backend:production
  build:
    context: .
    dockerfile: apps/api/Dockerfile
    args:
      API_BASE_IMAGE: python:3.11-slim-bookworm
  env_file:
    - .env.production
  environment:
    <<: *backend-env
  volumes:
    - zhixin_ai_uploads:/app/uploads
    - zhixin_ai_private_video_assets:/app/private-video-assets
  networks:
    - zhixin

services:
  postgres:
    <<: *default-security
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - zhixin_ai_postgres_data:/var/lib/postgresql/data
    networks:
      - zhixin
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    <<: *default-security
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
    volumes:
      - zhixin_ai_redis_data:/data
    networks:
      - zhixin
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    <<: *backend-service
    ports:
      - "127.0.0.1:18000:8000"
    environment:
      <<: *backend-env
      API_HOST: 0.0.0.0
      API_PORT: "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 60s

  worker:
    <<: *backend-service
    init: true
    shm_size: "1gb"
    command:
      - python
      - -m
      - app.worker_cli
      - --queues
      - default,publish,index,media,knowledge,seo,ai
      - --schedule
      - --schedule-interval
      - "60"
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # The old Redis-only probe reported "healthy" for three days while the main
      # loop was wedged, so it now also requires a fresh main-loop heartbeat file.
      # Docker does not restart an unhealthy container by itself: this makes the
      # wedge visible, and LoopWatchdog is what actually recovers it.
      test:
        - CMD-SHELL
        - python -c "from app.worker_cli import worker_health_probe; import sys; sys.exit(worker_health_probe())"
      interval: 20s
      timeout: 15s
      retries: 15
      start_period: 60s

  web:
    <<: *default-security
    image: zhixin-ai-web:production
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        WEB_BASE_IMAGE: node:20-alpine
        FASTAPI_BASE_URL: http://api:8000
        NEXT_PUBLIC_DESKTOP_DOWNLOAD_URL: ${NEXT_PUBLIC_DESKTOP_DOWNLOAD_URL:-/downloads/zhixin-ai-windows.exe}
    environment:
      FASTAPI_BASE_URL: http://api:8000
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-zhixin_session}
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:3001:3000"
    init: true
    networks:
      - zhixin
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "require('http').get('http://127.0.0.1:3000/login',(r)=>process.exit(r.statusCode&&r.statusCode<500?0:1)).on('error',()=>process.exit(1))"
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 45s

networks:
  zhixin:
    driver: bridge

volumes:
  zhixin_ai_private_video_assets:
  zhixin_ai_postgres_data:
    name: zhixin_ai_postgres_data
  zhixin_ai_redis_data:
    name: zhixin_ai_redis_data
  zhixin_ai_uploads:
    name: zhixin_ai_uploads
