[project]
name = "zhixin-ai-api"
version = "0.1.0"
description = "FastAPI backend for Zhixin AI SEO workflows."
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.28,<2",
  "fastapi>=0.133.1",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14.0",
  "psycopg[binary]>=3.2.3",
  "redis>=5.2.1",
  "pydantic-settings>=2.6.1",
  "email-validator>=2.2.0",
  "argon2-cffi>=23.1.0",
  "python-multipart>=0.0.20",
  "httpx>=0.28.1",
  "beautifulsoup4>=4.12.3",
  "pypdf>=5.1.0",
  "python-docx>=1.1.2",
  "google-auth[requests]>=2.38.0",
  "scrapling[fetchers]>=0.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4",
  "httpx>=0.28.1"
]
# After install: scrapling install  (downloads Chromium for StealthyFetcher)

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
